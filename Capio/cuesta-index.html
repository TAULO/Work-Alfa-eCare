<div id="app" class="flex h-screen flex-col bg-white font-sans text-navy" v-cloak>
    <!-- Scrollable area -->
    <div class="flex-1 overflow-y-auto p-4">
        <div class="mb-4 flex items-center gap-3">
            <label for="months" class="font-semibold">Antal månader (Markering):</label>
            <select id="months" v-model.number="selectedMonths"
                class="rounded border border-primary-light bg-white px-2 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                <option v-for="m in [9, 10, 11, 12]" :key="m" :value="m">{{ m }}</option>
            </select>
        </div>

        <table class="w-full table-fixed border-collapse">
            <colgroup>
                <col class="w-[35%]">
                <col>
                <col class="w-24">
                <col class="w-12">
            </colgroup>
            <thead>
                <tr class="border-b-2 border-primary-light text-left text-sm text-primary">
                    <th class="px-2 py-2 font-semibold">Läkare</th>
                    <th class="px-2 py-2 font-semibold">Dagar</th>
                    <th class="px-2 py-2 font-semibold">Antal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <template v-for="(row, i) in rows" :key="row.id">
                    <!-- Main row -->
                    <tr class="border-b border-surface">
                        <td class="px-2 py-2">
                            <input type="text" v-model="row.doctor" placeholder="Namn"
                                class="w-full rounded border border-primary-light px-2 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                        </td>
                        <td class="px-2 py-2">
                            <button type="button" @click="openRow = openRow === row.id ? null : row.id"
                                class="flex w-full cursor-pointer items-center justify-between gap-2 rounded border px-2 py-1 text-left"
                                :class="openRow === row.id
                                    ? 'border-primary ring-2 ring-primary'
                                    : 'border-primary-light hover:border-primary'">
                                <span :class="intervalString(row.intervals) ? '' : 'text-gray-400'">
                                    {{ intervalString(row.intervals) || 'Välj dagar' }}
                                </span>
                                <span class="text-xs text-primary">{{ openRow === row.id ? '▲' : '▼' }}</span>
                            </button>
                        </td>
                        <td class="px-2 py-2">
                            <input type="number" v-model.number="row.maxPatients" min="0" placeholder="∞"
                                class="w-full rounded border border-primary-light px-2 py-1 focus:outline-none focus:ring-2 focus:ring-primary">
                        </td>
                        <td class="px-2 py-2 text-center">
                            <button type="button" @click="removeRow(i)" aria-label="Ta bort"
                                class="cursor-pointer rounded border border-primary-light px-2 py-1 leading-none hover:border-red-400 hover:bg-red-50 hover:text-red-600">
                                ✕
                            </button>
                        </td>
                    </tr>
                    <!-- Day picker row -->
                    <tr v-show="openRow === row.id" class="border-b border-surface">
                        <td colspan="4" class="bg-surface px-2 py-3">
                            <div class="flex flex-wrap items-start gap-4">
                                <div class="grid grid-cols-7 gap-1">
                                    <button v-for="day in days" :key="day.day" type="button"
                                        @click="toggleInterval(row.intervals, day, $event)"
                                        :disabled="day.selected && !row.intervals.includes(day.day)"
                                        class="h-9 w-10 cursor-pointer rounded border border-primary-light text-sm transition-colors hover:bg-accent disabled:cursor-not-allowed disabled:bg-gray-100 disabled:text-gray-400 disabled:line-through disabled:hover:bg-gray-100"
                                        :class="row.intervals.includes(day.day) ? 'bg-green-200 border-green-500 hover:bg-green-300' : 'bg-white'">
                                        {{ day.day }}
                                    </button>
                                </div>
                                <div class="flex flex-col gap-2">
                                    <button type="button" @click="clearRowIntervals(row)"
                                        class="cursor-pointer rounded border border-primary-light bg-white px-4 py-2 hover:bg-accent">
                                        Rensa
                                    </button>
                                    <button type="button" @click="openRow = null"
                                        class="cursor-pointer rounded bg-primary px-4 py-2 text-white hover:bg-navy">
                                        Klar
                                    </button>
                                    <p class="text-xs text-gray-500">Shift-klick = välj intervall</p>
                                </div>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>

        <button type="button" @click="addRow()"
            class="mt-3 cursor-pointer rounded border border-dashed border-primary-light px-4 py-2 text-primary hover:border-primary hover:bg-surface">
            + Lägg till
        </button>
    </div>

    <!-- Pinned footer -->
    <div class="border-t border-primary-light bg-surface px-4 py-3">
        <div v-if="errorMsg" class="mb-3 rounded border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-700">
            {{ errorMsg }}
        </div>

        <div v-if="allIntervals.length > 0"
            class="mb-3 rounded border border-yellow-300 bg-yellow-50 px-3 py-2 text-sm text-yellow-700">
            Dagar som saknas: {{ intervalString(allIntervals) }}
        </div>

        <div class="flex items-center justify-between gap-4">
            <button type="button" @click="confirm"
                class="cursor-pointer rounded bg-primary px-6 py-2 font-semibold text-white hover:bg-navy">
                Bekräfta
            </button>
            <div class="flex flex-col gap-1 text-sm">
                <label class="flex cursor-pointer items-center gap-2">
                    <input type="checkbox" v-model="excludeIfMarkering1HasDate" class="accent-primary">
                    Ignorera patienter med ifylld Markering 1
                </label>
                <label class="flex cursor-pointer items-center gap-2">
                    <input type="checkbox" v-model="excludeIfPatientHasDementia" class="accent-primary">
                    Ignorera patienter med demens
                </label>
            </div>
        </div>
    </div>
</div>

<style type="text/tailwindcss">
    @theme {
            --color-primary: #407ec9;
            --color-primary-light: #72a0d4;
            --color-navy: #0d3050;
            --color-surface: #eaf0fb;
            --color-accent: #fde1ab;
            --font-sans: proxima-nova, Arial, sans-serif;
        }
</style>

<!-- VUE -->
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<!-- TAILWIND -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script>
    // WORKAROUND: Manatee's Sticky container adds a document-level mousedown
    // listener, which prevents HTML inputs/selects from receiving focus on click.
    document.addEventListener('mousedown', function (e) {
        e.stopImmediatePropagation();
    }, true);

    const cachedDoctorGroups = ${ JSON.stringify(doctorGroups || [])};
    const cachedSelectedMonths = ${ JSON.stringify(selectedMonths || 12)};
    const isTest = ${ JSON.stringify(isTest)};

    const interval = 7;
    const maxDaysThisMonth = 31;

    const { createApp, ref, reactive, computed } = Vue;

    const app = createApp({
        setup() {
            let nextId = 0;
            const makeRow = (doctor = '', intervals = [], maxPatients = '') =>
                reactive({ id: nextId++, doctor, intervals, maxPatients });

            const rows = ref(
                cachedDoctorGroups.length
                    ? cachedDoctorGroups.map(g => makeRow(g.doctor, g.intervals, g.maxPatients ?? ''))
                    : [makeRow()]
            );
            const selectedMonths = ref(cachedSelectedMonths);
            const excludeIfMarkering1HasDate = ref(false);
            const excludeIfPatientHasDementia = ref(false);

            const openRow = ref(null);

            const days = ref(Array.from({ length: 31 }, (_, i) => {
                return {
                    day: i + 1,
                    selected: false,
                }
            }));

            function addRow() {
                rows.value.push(makeRow());
            }

            function removeRow(i) {
                if (rows.value.length > 1) rows.value.splice(i, 1);
            }

            function toggleInterval(intervals, day, event) {
                const index = intervals.indexOf(day.day);

                console.log('event', event);

                day.selected = !day.selected;

                if (index === -1) {
                    intervals.push(day.day);
                } else {
                    intervals.splice(index, 1);
                }
            }

            function clearRowIntervals(row) {
                row.intervals.forEach(day => {
                    const found = days.value.find(d => d.day === day);
                    if (found) found.selected = false;
                });

                row.intervals = [];
            }

            function intervalString(intervals) {
                const nums = [...new Set((intervals ?? []).map(Number))]
                    .filter(n => !Number.isNaN(n))
                    .sort((a, b) => a - b);

                const ranges = [];
                for (const n of nums) {
                    const last = ranges.at(-1);
                    if (last && n === last[1] + 1) last[1] = n;
                    else ranges.push([n, n]);
                }

                return ranges
                    .map(([start, end]) => (start === end ? `${start}` : `${start}-${end}`))
                    .join(", ");
            }

            const allIntervals = computed(() => rows.value.flatMap(r => r.intervals));

            console.log(allIntervals);

            // Per-row field errors, e.g. [{ doctor: true, maxPatients: false }, {...}]
            const rowErrors = computed(() => rows.value.map(r => {
                const raw = String(r.maxPatients ?? '').trim();
                const maxPatients = raw === '' ? null : parseInt(raw);
                return {
                    doctor: !r.doctor.trim(),
                    maxPatients: maxPatients !== null && (isNaN(maxPatients) || maxPatients < 0),
                };
            }));

            const groups = computed(() => rows.value
                .filter(r => r.doctor.trim())
                .map(r => {
                    const raw = String(r.maxPatients ?? '').trim();
                    return {
                        doctor: r.doctor.trim(),
                        maxPatients: raw === '' ? null : parseInt(raw),
                        intervals: r.intervals
                    };
                }));

            const hasFieldErrors = computed(() => rowErrors.value.some(e => Object.values(e).some(Boolean)));
            const isValid = computed(() => !hasFieldErrors.value && groups.value.length > 0);
            const errorMsg = computed(() =>
                groups.value.length === 0 ? 'Lägg till minst en läkare'
                    : hasFieldErrors.value ? 'Kontrollera markerade fält'
                        : '');

            function confirm() {
                if (!isValid.value) return;

                const result = {
                    selectedMonths: selectedMonths.value,
                    doctorGroups: groups.value,
                    excludeIfMarkering1HasDate: excludeIfMarkering1HasDate.value,
                    excludeIfPatientHasDementia: excludeIfPatientHasDementia.value,
                };
                const data = encodeURIComponent(JSON.stringify(result));
                const url = 'manatee:runflow/withsubject/' +
                    (isTest ? 'kontrollista-process-test' : 'kontrollista-process') +
                    '?data=' + data;

                // On the local dev server there is no handler for manatee: URLs
                if (['localhost', '127.0.0.1'].includes(location.hostname)) {
                    console.log('[dev] would navigate to:', url);
                    console.log('[dev] result:', result);
                    return;
                }
                window.location = url;
            }

            return {
                rows,
                days,
                selectedMonths,
                excludeIfMarkering1HasDate,
                excludeIfPatientHasDementia,
                isValid,
                errorMsg,
                openRow,
                addRow,
                removeRow,
                toggleInterval,
                clearRowIntervals,
                intervalString,
                confirm,
                allIntervals,
            };
        },
    });

    app.mount('#app');
</script>
